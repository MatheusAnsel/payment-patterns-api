name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configura Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build e testes
        run: ./mvnw -B verify

      - name: Publica relatorios de teste em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-surefire
          path: target/surefire-reports/
