services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pagamentos
      POSTGRES_USER: pagamentos
      POSTGRES_PASSWORD: pagamentos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagamentos -d pagamentos"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/pagamentos
      DB_USERNAME: pagamentos
      DB_PASSWORD: pagamentos
    ports:
      - "8080:8080"

volumes:
  postgres-data:
